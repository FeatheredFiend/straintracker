<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b110e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7f3" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Strain Tracker</title>
    <script>
      // Apply a saved theme before first paint so there's no flash.
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
