security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|app)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # The React app logs in with a JSON POST and then rides the
            # session cookie - same origin, so no tokens or CORS needed.
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout
            entry_point: App\Security\JsonEntryPoint
            access_denied_handler: App\Security\JsonAccessDeniedHandler
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                always_remember_me: true

    # Note: Only the *first* matching rule is applied. Everything outside
    # /api is the React shell and its static files, which are public - the
    # data behind them is not.
    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/me$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        firewalls:
            main:
                login_throttling: false
